services:
  postgres:
    image: postgres:16
    container_name: petshop-postgres
    environment:
      POSTGRES_USER: petshop_app
      POSTGRES_PASSWORD: petshop123
      POSTGRES_DB: petshop2026_dev
    ports:
      - "5433:5432"
    volumes:
      - petshop_pgdata:/var/lib/postgresql/data
      - ./docs/sql/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petshop_app -d petshop2026_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  petshop_pgdata:
